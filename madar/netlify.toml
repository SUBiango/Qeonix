# Netlify site: madar.qeonix.com
# Base directory for this site is "madar", so every path below is relative to it.
# Static, no build: the page is a single self-contained index.html.
[build]
  publish = "site"
  # Don't rebuild this site when a push only touched another site in the repo.
  # Netlify runs this from the base directory; a non-zero exit means "do build".
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# Security headers. Deliberately looser than qeonix.com's CSP in two places,
# because this page carries its own CSS and JS inline:
#   style-src  'unsafe-inline' — the markup uses inline <style> blocks and
#                                ~150-220 style="" attributes (attributes can't
#                                be covered by hashes or a nonce).
#   script-src 'unsafe-inline' — one inline <script> block. A sha256 hash would
#                                be stricter, but it must be regenerated by hand
#                                after every edit, and a stale hash kills the
#                                page silently. The page takes no user input,
#                                reads no query string, posts no form and makes
#                                no network calls, so there is no injection sink
#                                for the directive to protect.
# Everything else stays locked down: no third-party scripts, no framing,
# no forms, no plugins.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
