# Static site (no build). Declares where serverless functions live so the
# contact form can forward leads to Zoho Flow via /.netlify/functions/zoho-lead,
# and sets security headers for all responses.
[functions]
  directory = "netlify/functions"

# Security headers applied to every response.
# HSTS uses includeSubDomains + preload (2-year max-age) so the domain is
# eligible for the browser HSTS preload list (submit at hstspreload.org).
# CSP allows inline <style>/<script> (this is a hand-authored static page with
# no user-input reflected into the DOM) and Google Fonts; everything else is
# locked to same-origin.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
